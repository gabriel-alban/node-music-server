<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chunk Upload Test</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
      }

      h1,
      h2 {
        margin-bottom: 12px;
      }

      .block {
        margin-bottom: 24px;
        padding: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      input,
      button,
      textarea {
        width: 100%;
        margin-top: 8px;
        margin-bottom: 12px;
        padding: 10px;
        box-sizing: border-box;
      }

      button {
        cursor: pointer;
      }

      progress {
        width: 100%;
        height: 20px;
      }

      pre {
        background: #f6f6f6;
        padding: 12px;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #songsList {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .song-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        gap: 12px;
      }

      .song-title {
        font-weight: 600;
      }

      .song-row audio {
        width: 100%;
      }

      .player-controls {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .player-controls button {
        width: auto;
        margin: 0;
      }

      #nowPlaying {
        margin-bottom: 8px;
        font-weight: 600;
      }

      .player-song-picker {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
      }

      .player-song-picker select {
        flex: 1;
        padding: 10px;
      }

      .player-song-picker button {
        width: auto;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>Audio Chunk Upload Test</h1>

    <div class="block">
      <h2>Login</h2>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="loginBtn" type="button">Login</button>
    </div>

    <div class="block">
      <h2>Token</h2>
      <textarea id="token" rows="4" placeholder="JWT token"></textarea>
    </div>

    <div class="block">
      <h2>Upload</h2>
      <input id="audioFile" type="file" accept="audio/*" />
      <button id="uploadBtn" type="button">Upload Audio</button>
      <progress id="progress" value="0" max="100"></progress>
    </div>

    <div class="block">
      <h2>Player</h2>
      <p id="nowPlaying">Now playing: none</p>
      <audio id="player" controls></audio>
      <div class="player-song-picker">
        <select id="songSelect">
          <option value="">No songs loaded</option>
        </select>
        <button id="loadSongsBtn" type="button">Load Songs</button>
      </div>
      <div class="player-controls">
        <button id="prevSongBtn" type="button">Previous Song</button>
        <button id="playPauseBtn" type="button">Play</button>
        <button id="nextSongBtn" type="button">Next Song</button>
      </div>
    </div>

    <!-- <div class="block">
      <h2>My Songs</h2>
      <button id="refreshSongsBtn" type="button">Refresh Songs</button>
      <div id="songsList"></div>
    </div>

    <div class="block">
      <h2>Logs</h2>
      <pre id="logs"></pre>
    </div> -->

    <script>
      const CHUNK_SIZE = 1024 * 1024;
      const logs = document.getElementById("logs");
      const progress = document.getElementById("progress");
      const tokenInput = document.getElementById("token");
      const player = document.getElementById("player");
      const songsList = document.getElementById("songsList");
      const songSelect = document.getElementById("songSelect");
      const loadSongsBtn = document.getElementById("loadSongsBtn");
      const nowPlaying = document.getElementById("nowPlaying");
      const playPauseBtn = document.getElementById("playPauseBtn");
      let songsQueue = [];
      let currentSongIndex = -1;

      function streamUrlById(id) {
        return `/api/songs/${id}/stream`;
      }

      function log(message) {
        if (logs) {
          logs.textContent += message + "\n";
        }
        console.log(message);
      }

      function updatePlayPauseLabel() {
        playPauseBtn.textContent = player.paused ? "Play" : "Pause";
      }

      function setCurrentSong(index) {
        if (!songsQueue.length || index < 0 || index >= songsQueue.length) {
          currentSongIndex = -1;
          player.removeAttribute("src");
          player.load();
          nowPlaying.textContent = "Now playing: none";
          updatePlayPauseLabel();
          return;
        }

        currentSongIndex = index;
        const song = songsQueue[currentSongIndex];
        player.src = streamUrlById(song.id);
        player.load();
        nowPlaying.textContent = `Now playing: ${song.name}`;
        updatePlayPauseLabel();
      }

      function nextSong() {
        if (!songsQueue.length) {
          return;
        }

        const nextIndex = (currentSongIndex + 1) % songsQueue.length;
        setCurrentSong(nextIndex);
        player.play().catch(() => {});
      }

      function previousSong() {
        if (!songsQueue.length) {
          return;
        }

        const prevIndex =
          (currentSongIndex - 1 + songsQueue.length) % songsQueue.length;
        setCurrentSong(prevIndex);
        player.play().catch(() => {});
      }

      function renderSongs(songs) {
        if (!Array.isArray(songs) || songs.length === 0) {
          if (songsList) {
            songsList.innerHTML = "<p>No songs found</p>";
          }
          songSelect.innerHTML = '<option value="">No songs loaded</option>';
          songsQueue = [];
          setCurrentSong(-1);
          return;
        }

        songsQueue = songs;

        if (currentSongIndex < 0 || currentSongIndex >= songsQueue.length) {
          setCurrentSong(0);
        }

        songSelect.innerHTML = songsQueue
          .map(
            (song, index) => `<option value="${index}">${song.name}</option>`,
          )
          .join("");

        songSelect.value = String(currentSongIndex >= 0 ? currentSongIndex : 0);

        if (songsList) {
          songsList.innerHTML = songs
            .map(
              (song) => `
                <div class="song-row">
                  <span class="song-title">${song.name}</span>
                  <button type="button" data-song-id="${song.id}">Play in main player</button>
                </div>
              `,
            )
            .join("");

          songsList
            .querySelectorAll("button[data-song-id]")
            .forEach((button) => {
              button.addEventListener("click", () => {
                const songId = Number(button.dataset.songId);
                const index = songsQueue.findIndex(
                  (song) => song.id === songId,
                );

                if (index >= 0) {
                  setCurrentSong(index);
                  songSelect.value = String(index);
                  player.play().catch(() => {});
                }
              });
            });
        }
      }

      async function loadSongs() {
        const response = await fetch("/api/songs");
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Failed to load songs");
        }

        const songs = Array.isArray(result) ? result : result.data || [];
        renderSongs(songs);
        log(`Loaded ${songs.length} songs`);
      }

      function createUploadId() {
        return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      async function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email, password }),
        });

        const result = await response.json();

        if (!response.ok || !result.token) {
          throw new Error(result.message || "Login failed");
        }

        tokenInput.value = result.token;
        log("Login successful");
      }

      async function uploadFile(file, token) {
        const uploadId = createUploadId();
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
        let finalFileData = null;

        log(`Upload started: ${file.name}`);
        log(`Size: ${file.size} bytes`);
        log(`Chunks: ${totalChunks}`);

        for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex += 1) {
          const start = chunkIndex * CHUNK_SIZE;
          const end = Math.min(start + CHUNK_SIZE, file.size);
          const chunk = file.slice(start, end);

          const formData = new FormData();
          formData.append("chunk", chunk, file.name);
          formData.append("uploadId", uploadId);
          formData.append("fileName", file.name);
          formData.append("chunkIndex", String(chunkIndex));
          formData.append("totalChunks", String(totalChunks));
          formData.append("totalSize", String(file.size));

          const response = await fetch("/api/admin/songs", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
            },
            body: formData,
          });

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.error || `Chunk ${chunkIndex} failed`);
          }

          log(`Chunk ${chunkIndex + 1}/${totalChunks} uploaded`);
          progress.value = Math.round(((chunkIndex + 1) / totalChunks) * 100);

          if (result.data.status === "completed") {
            finalFileData = result.data;
          }
        }

        if (!finalFileData) {
          throw new Error("File was not assembled after last chunk");
        }

        log("All chunks uploaded");
        log(`Assembled file: ${finalFileData.fileName}`);
        log(`Public path: ${finalFileData.path}`);

        const completeResponse = await fetch("/api/admin/songs/complete", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({
            fileName: finalFileData.fileName,
            path: finalFileData.path,
          }),
        });

        const completeResult = await completeResponse.json();

        if (!completeResponse.ok || !completeResult.success) {
          throw new Error(completeResult.error || "Complete upload failed");
        }

        log("Saved in DB");
        log(`DB path: ${completeResult.data.path}`);

        return completeResult.data;
      }

      document
        .getElementById("loginBtn")
        .addEventListener("click", async () => {
          if (logs) {
            logs.textContent = "";
          }
          try {
            await login();
          } catch (error) {
            log(error.message);
          }
        });

      document
        .getElementById("uploadBtn")
        .addEventListener("click", async () => {
          if (logs) {
            logs.textContent = "";
          }
          progress.value = 0;

          const fileInput = document.getElementById("audioFile");
          const file = fileInput.files[0];
          const token = tokenInput.value.trim();

          if (!file) {
            log("Select an audio file first");
            return;
          }

          if (!token) {
            log("Missing JWT token");
            return;
          }

          try {
            const savedSong = await uploadFile(file, token);
            await loadSongs();
            const savedIndex = songsQueue.findIndex(
              (song) => song.id === savedSong.id,
            );

            if (savedIndex >= 0) {
              setCurrentSong(savedIndex);
            }

            log("Audio preview ready");
          } catch (error) {
            log(error.message);
          }
        });

      document.getElementById("nextSongBtn").addEventListener("click", () => {
        nextSong();
        if (currentSongIndex >= 0) {
          songSelect.value = String(currentSongIndex);
        }
      });

      document.getElementById("prevSongBtn").addEventListener("click", () => {
        previousSong();
        if (currentSongIndex >= 0) {
          songSelect.value = String(currentSongIndex);
        }
      });

      songSelect.addEventListener("change", () => {
        const index = Number(songSelect.value);
        if (Number.isNaN(index) || index < 0 || index >= songsQueue.length) {
          return;
        }

        setCurrentSong(index);
      });

      loadSongsBtn.addEventListener("click", async () => {
        try {
          await loadSongs();
        } catch (error) {
          log(error.message);
        }
      });

      playPauseBtn.addEventListener("click", async () => {
        if (!songsQueue.length) {
          return;
        }

        if (currentSongIndex < 0) {
          setCurrentSong(0);
        }

        try {
          if (player.paused) {
            await player.play();
          } else {
            player.pause();
          }
        } catch (error) {
          log(error.message);
        }
      });

      player.addEventListener("play", updatePlayPauseLabel);
      player.addEventListener("pause", updatePlayPauseLabel);
      player.addEventListener("ended", () => {
        nextSong();
        if (currentSongIndex >= 0) {
          songSelect.value = String(currentSongIndex);
        }
      });

      const refreshSongsBtn = document.getElementById("refreshSongsBtn");
      if (refreshSongsBtn) {
        refreshSongsBtn.addEventListener("click", async () => {
          try {
            await loadSongs();
          } catch (error) {
            log(error.message);
          }
        });
      }

      loadSongs().catch((error) => {
        log(error.message);
      });
    </script>
  </body>
</html>
